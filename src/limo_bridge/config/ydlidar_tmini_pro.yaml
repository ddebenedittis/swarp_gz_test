# EAI / YDLIDAR T-mini Pro on the Limo (ydlidar_ros2_driver), full circle at 10 Hz.
# From YDLIDAR's params/TminiPro.yaml; AgileX's limo_bringup crops angle_min/max to +-90,
# the policy needs the full circle (the rear sector the chassis hides is blanked later).
# Check the scan's 0 deg against the robot's heading with limo_real's measure_lidar_static.
/**:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: laser_link
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    sample_rate: 4
    intensity_bit: 8
    abnormal_check_count: 4
    fixed_resolution: true
    reversion: true
    inverted: true
    auto_reconnect: true
    isSingleChannel: false
    intensity: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 12.0
    range_min: 0.02
    frequency: 10.0
    invalid_range_is_inf: false
