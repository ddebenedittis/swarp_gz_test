# nav2_amcl for one Limo, namespaced by limo_bridge's amcl.launch.py, which also sets the
# frames (map, <robot>/odom, <robot>/base_footprint), the scan topic, robot_model_type
# (it differs between Foxy and Humble+) and the initial pose.
#
# Tuned for Push-T in Gazebo (L6 pushing episodes, docs/real_robot.md):
# - the scan is robot_bridge's /<robot>/scan_loc, without the returns inside the arena (the
#   T and the robots, not on the map): p95 position error 1.30 -> 0.58 m, p95 heading
#   0.106 -> 0.060 rad, no more flipped headings; laser_min_range 0.3 drops the chassis;
# - update every 2 cm / 0.03 rad: nav2 AMCL filters only when the odometry moved past the
#   thresholds (strictly), so 0 / 0 updates on every scan while moving but still never for
#   a robot shoved with its wheels and IMU still; 0 / 0 measured no better than these;
# - large translation noise (alpha3/4 0.5) and random-particle recovery: a robot shoved by
#   the T or its teammate moves without its odometry seeing it, and without them the
#   estimate stayed 0.3-0.5 m off for tens of seconds;
# - the odometry's heading comes from the IMU (limo_base; robot_bridge's imu_topic in
#   Gazebo), so alpha1/2 matter less;
# - a sharper likelihood field (sigma_hit 0.05-0.1, max_dist 0.3-1.0, 180 beams), the beam
#   model, beam skipping and more particles were no better; driving a clean circle leaves
#   a 5-12 cm offset with every setting tried.
/**:
  ros__parameters:
    alpha1: 0.4
    alpha2: 0.2
    alpha3: 0.5
    alpha4: 0.5
    alpha5: 0.1
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.3
    laser_model_type: likelihood_field
    max_beams: 90
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.2
    update_min_a: 0.03
    update_min_d: 0.02
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
